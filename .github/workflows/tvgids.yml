name: Update TV-gids

on:
  schedule:
    # Elke 30 minuten (UTC). GitHub kan iets vertragen bij drukte.
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: tvgids
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installeer dependencies
        run: npm install cheerio dayjs --no-save

      - name: Haal TV-gids op
        run: node scripts/fetch-tvgids.js

      - name: Commit en push wijzigingen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tvgids.json
          if git diff --staged --quiet; then
            echo "Geen wijzigingen."
          else
            git commit -m "Update TV-gids data"
            git push
          fi
